name: fleetflow

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetflow}
      POSTGRES_USER: ${POSTGRES_USER:-fleetflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local password in .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/src/FleetFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FleetFlow: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-fleetflow};Username=${POSTGRES_USER:-fleetflow};Password=${POSTGRES_PASSWORD:?Generate a local password in .env first};Timeout=5;Command Timeout=5;GSS Encryption Mode=Disable"
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
