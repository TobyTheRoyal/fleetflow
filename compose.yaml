name: fleetflow

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetflow}
      POSTGRES_USER: ${POSTGRES_USER:-fleetflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local password in .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/src/FleetFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-cloudflare}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-@cf/zai-org/glm-4.7-flash}
      AI_FREE_TIER_VERIFIED: ${AI_FREE_TIER_VERIFIED:-false}
      AI_FREE_TIER_VERIFIED_MODEL: ${AI_FREE_TIER_VERIFIED_MODEL:-}
      AI_FREE_TIER_VERIFIED_UNTIL_UTC: ${AI_FREE_TIER_VERIFIED_UNTIL_UTC:-}
      AI_USAGE_TERMS_VERIFIED: ${AI_USAGE_TERMS_VERIFIED:-false}
      AI_FICTIONAL_DATA_CONFIRMED: ${AI_FICTIONAL_DATA_CONFIRMED:-false}
      AI_ALLOWED_USER_IDS: ${AI_ALLOWED_USER_IDS:-}
      AI_USER_DAILY_LIMIT: ${AI_USER_DAILY_LIMIT:-3}
      AI_GLOBAL_DAILY_LIMIT: ${AI_GLOBAL_DAILY_LIMIT:-20}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-10}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-500}
      AI_MAX_INPUT_BYTES: ${AI_MAX_INPUT_BYTES:-6000}
      DemoUsers__AdminPassword: ${DEMO_ADMIN_PASSWORD:-}
      DemoUsers__DispatcherPassword: ${DEMO_DISPATCHER_PASSWORD:-}
      DemoUsers__ViewerPassword: ${DEMO_VIEWER_PASSWORD:-}
      ConnectionStrings__FleetFlow: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-fleetflow};Username=${POSTGRES_USER:-fleetflow};Password=${POSTGRES_PASSWORD:?Generate a local password in .env first};Timeout=5;Command Timeout=5;GSS Encryption Mode=Disable"
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
